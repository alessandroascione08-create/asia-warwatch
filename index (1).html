<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Conflitti in Asia</title>
<meta name="color-scheme" content="dark"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#0a0c11;--card:#12151c;--card2:#181c25;--ink:#eef1f6;--mu:#8e98aa;--ln:#232836;--acc:#ff4d5e}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.hd{position:sticky;top:0;z-index:30;background:rgba(10,12,17,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.hdi{display:flex;align-items:center;gap:24px;height:58px}
.logo{font-weight:800;font-size:19px;letter-spacing:.04em;text-decoration:none}.logo::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--acc);margin-right:10px;box-shadow:0 0 0 0 var(--acc);animation:pu 2s infinite}
nav{display:flex;gap:4px;margin-left:auto}nav a{font-size:14px;font-weight:500;text-decoration:none;color:var(--mu);padding:7px 14px;border-radius:99px;transition:.2s}nav a:hover{color:var(--ink);background:var(--card2)}
#up{font-size:12px;color:var(--mu);white-space:nowrap}@media(max-width:700px){#up{display:none}.hdi{gap:10px}nav a{padding:7px 9px;font-size:13px}}
.sub{display:flex;justify-content:space-between;gap:12px;color:var(--mu);font-size:13px;padding:14px 20px 0;max-width:1180px;margin:0 auto}
.tick{background:var(--card);border-block:1px solid var(--ln);display:flex;font-size:13px;margin-top:14px}.tick b{flex-shrink:0;background:var(--acc);color:#fff;padding:8px 16px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:11.5px;position:relative;z-index:2;display:flex;align-items:center}
.tw{flex:1;min-width:0;overflow:hidden;color:var(--mu)}.tw div{display:inline-block;white-space:nowrap;padding:8px 0 8px 100%;animation:mq 170s linear infinite}.tw:hover div{animation-play-state:paused}@keyframes mq{to{transform:translateX(-100%)}}
main{padding:28px 0 70px;min-height:60vh}
.sec{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:56px 0 20px;display:flex;align-items:center;gap:12px}.sec::before{content:"";width:5px;height:24px;border-radius:3px;background:var(--acc)}
.kick{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c,var(--acc));background:color-mix(in srgb,var(--c,var(--acc)) 16%,transparent);padding:3px 10px;border-radius:99px}.meta{font-size:12.5px;color:var(--mu)}
figure{margin:0;aspect-ratio:16/9;background:linear-gradient(135deg,var(--c,#334),#0a0c11);overflow:hidden;position:relative;border-radius:16px}figure img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
figure span{position:absolute;left:16px;bottom:14px;color:#fff;font-weight:800;font-size:13px;letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.lead{display:grid;grid-template-columns:2fr 1fr;gap:24px}@media(max-width:860px){.lead{grid-template-columns:1fr}}
.hero{position:relative;border-radius:20px;overflow:hidden;min-height:440px;display:flex;background:#111}.hero figure{position:absolute;inset:0;aspect-ratio:auto;border-radius:0;height:100%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,rgba(5,6,9,.92))}.hero .ov{position:relative;z-index:2;align-self:flex-end;padding:28px}.hero h1{font-size:clamp(26px,4vw,42px);line-height:1.12;letter-spacing:-.025em;margin:12px 0 8px}.hero p{color:#c3cad8;margin:0 0 8px;max-width:640px}
.side{display:flex;flex-direction:column;gap:12px}.side article{display:grid;grid-template-columns:104px 1fr;gap:14px;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:10px;transition:.2s}.side article:hover{border-color:#3a4258}.side figure{aspect-ratio:1;border-radius:12px}.side h3{font-size:15px;line-height:1.3;margin:6px 0 4px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;overflow:hidden;transition:.25s;height:100%}.card:hover{transform:translateY(-4px);border-color:var(--c);box-shadow:0 14px 40px -14px var(--c)}.card:hover img{transform:scale(1.05)}
.card figure{border-radius:0}.card .b{padding:16px 18px 20px}.card h3{margin:10px 0 6px;font-size:19px;line-height:1.25;letter-spacing:-.01em}.card p{margin:0;font-size:14.5px;color:var(--mu)}.card.n h3{font-size:16px;font-weight:600}
#map{height:500px;border:1px solid var(--ln);border-radius:20px;background:#0d111a;overflow:hidden}
.leg{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;font-size:13px}.leg a{text-decoration:none;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--ln);padding:6px 12px;border-radius:99px}.leg a:hover{border-color:var(--c)}.leg i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.dot{display:block;width:var(--s);height:var(--s);border-radius:50%;background:var(--c);opacity:.92;border:2px solid #fff;animation:pu 2.2s infinite}@keyframes pu{0%{box-shadow:0 0 0 0 var(--c)}70%{box-shadow:0 0 0 18px transparent}100%{box-shadow:0 0 0 0 transparent}}
.leaflet-popup-content-wrapper{border-radius:14px}.leaflet-popup-content{font:14px/1.5 Inter,Arial,sans-serif;color:#10131a}.leaflet-popup-content a{color:#c1121f;font-weight:600}
.pg .back{display:inline-flex;font-size:13px;font-weight:600;text-decoration:none;color:var(--mu);background:var(--card);border:1px solid var(--ln);padding:7px 14px;border-radius:99px}.pg .back:hover{color:var(--ink)}
.pg h1{font-size:clamp(40px,7vw,80px);line-height:1;margin:18px 0 12px;letter-spacing:-.04em;font-weight:800}.deck{font-size:21px;color:var(--mu);margin:0 0 26px;max-width:760px;line-height:1.45}
.pg figure{aspect-ratio:21/9;border-radius:22px}.cap{font-size:12.5px;color:var(--mu);margin:8px 0 0}.cap a{text-decoration:underline}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:26px 0}.kv div{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:18px}.kv b{display:block;font-size:34px;line-height:1.1;color:var(--c);letter-spacing:-.02em}.kv small{font-size:13px;color:var(--mu)}
.cols{columns:2 320px;column-gap:36px;font-size:17px}.cols p{break-inside:avoid;margin:0 0 16px}
.tl{border-left:2px solid var(--ln);margin-left:6px}.tl div{padding:0 0 18px 22px;position:relative}.tl div::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px var(--bg)}.tl b{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.tm{background:var(--card);border:1px solid var(--ln);border-left:4px solid var(--c);border-radius:16px;padding:18px 22px;margin:0 0 16px}.tm p{font-size:17px;margin:8px 0;color:#d6dbe6}.tm .meta a{color:var(--c);font-weight:600}
.src a{display:inline-block;font-size:13px;margin:4px 8px 4px 0;background:var(--card);border:1px solid var(--ln);padding:6px 13px;border-radius:99px;text-decoration:none}.src a:hover{border-color:var(--c)}
#ts{position:fixed;right:16px;bottom:16px;z-index:40;display:grid;gap:10px;max-width:340px}.toast{background:var(--card2);color:var(--ink);padding:14px 18px;border:1px solid var(--ln);border-left:4px solid var(--acc);border-radius:14px;font-size:14px;line-height:1.4;box-shadow:0 12px 40px #0008}
footer{border-top:1px solid var(--ln);padding:26px 20px;text-align:center;color:var(--mu);font-size:13px}

.back{position:absolute;left:22px;top:22px;z-index:4}
.flag{display:flex;height:6px;border-radius:99px;overflow:hidden;margin-bottom:14px}.flag i{flex:1}
.pg{--c:var(--c1);position:relative}.pg::before{content:"";position:absolute;inset:-40px -30px auto;height:560px;background:radial-gradient(720px 340px at 12% 0,color-mix(in srgb,var(--c1) 26%,transparent),transparent),radial-gradient(620px 320px at 92% 0,color-mix(in srgb,var(--c2) 22%,transparent),transparent);z-index:-1;pointer-events:none}
.ph{position:relative;border-radius:28px;overflow:hidden;min-height:500px;display:flex;align-items:flex-end;background:radial-gradient(800px 380px at 88% 0,color-mix(in srgb,var(--c2) 70%,transparent),transparent),linear-gradient(135deg,var(--c1),#0a0c11 78%);border:1px solid color-mix(in srgb,var(--c1) 40%,var(--ln))}
.ph>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.pgl{position:absolute;inset:0;background:linear-gradient(100deg,color-mix(in srgb,var(--c1) 55%,transparent),transparent 55%),linear-gradient(180deg,transparent 30%,rgba(6,8,12,.94))}
.pc{position:relative;z-index:3;padding:38px;max-width:820px}.chip{display:inline-block;font-size:12px;font-weight:600;padding:6px 14px;margin:0 8px 8px 0;border-radius:99px;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.22)}
.ph h1{font-size:clamp(44px,8vw,92px)!important;margin:6px 0 10px!important;text-shadow:0 4px 30px rgba(0,0,0,.45)}.ph .deck{color:#e1e6f0;margin:0 0 10px}.ph .cap{color:#b9c1d1;margin:0}
.glass{background:rgba(14,17,24,.5);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:16px 20px}
.fl{position:absolute;right:22px;top:22px;z-index:3;min-width:160px}.fl span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#c3cad8}.fl b{display:block;font-size:30px;line-height:1.15;margin-bottom:8px}
.ib{display:flex;gap:4px;margin:2px 0 12px}.ib u{height:6px;flex:1;border-radius:3px;background:rgba(255,255,255,.2)}.ib u.on{background:linear-gradient(90deg,var(--c1),var(--c2))}
.pg .sec::before{background:linear-gradient(var(--c1),var(--c2))}.pg .kv b{background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.pg .kv div{border-top:3px solid var(--c1)}.pg .tl div::before{background:linear-gradient(135deg,var(--c1),var(--c2))}.pg .tm{border-left:4px solid var(--c1);background:linear-gradient(90deg,color-mix(in srgb,var(--c1) 10%,var(--card)),var(--card))}
.pg .src a:hover,.pg .tm .meta a{border-color:var(--c1);color:var(--c1)}
figure img{object-position:center 30%}.card figure{aspect-ratio:16/10}.side figure{aspect-ratio:1}
@media(max-width:700px){.ph{min-height:560px}.fl{position:relative;right:auto;top:auto;margin:70px 22px 0;align-self:flex-start}.ph{flex-direction:column;justify-content:flex-end}.pc{padding:22px}}
</style></head><body>
<header class="hd"><div class="wrap hdi"><a class="logo" href="#home" id="nm"></a><nav><a href="#home">Prima pagina</a><a href="#mappa">Mappa</a><a href="#conflitti">Conflitti</a><a href="#notizie">Notizie</a></nav><span id="up"></span></div></header>
<div class="sub"><span id="dt"></span><span id="sb"></span></div>
<div class="tick"><b>Ultim’ora</b><div class="tw"><div id="tk"></div></div></div>
<main class="wrap" id="app"></main><div id="ts"></div>
<footer class="wrap" id="ft"></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=id=>document.getElementById(id);let S={},C=[],M={},NEWS=[],CT={},UPD=null,MP,ML;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const H=s=>/^https?:\/\//.test(s||"")?esc(s):"";
const ST={attivo:"Conflitto aperto",tensione:"Alta tensione",tregua:"Tregua fragile"};
const ago=t=>{const m=Math.round((Date.now()-new Date(t))/6e4);return m<60?m+" min fa":m<1440?Math.round(m/60)+" h fa":new Date(t).toLocaleDateString("it-IT",{day:"numeric",month:"short"})};
const col=x=>(M[(x.k||[])[0]]||{}).colore||"#555";
const ART={};const fig=(img,c,txt)=>`<figure style="--c:${c};${ART[c]?`background-image:url('${ART[c]}');background-size:cover`:""}">${H(img)&&S.foto!==false?`<img src="${H(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}<span>${esc(txt||"")}</span></figure>`;
const link=x=>`<a href="${H(x.u)}" target="_blank" rel="noopener">${esc(x.title)}</a>`;
const kick=x=>`<span class="kick" style="--c:${col(x)}">${esc((M[(x.k||[])[0]]||{}).nome||"Asia")}</span>`;
const nc=x=>`<article class="card n" style="--c:${col(x)}">${fig(x.img,col(x),(M[x.k[0]]||{}).nome)}<div class="b">${kick(x)}<h3>${link(x)}</h3><div class="meta">${esc(x.fonte)} · ${ago(x.t)}</div></div></article>`;
function art(c){let h=0;for(const ch of c.id)h=(h*131+ch.charCodeAt(0))%100003;const R=()=>(h=(h*1103515245+12345)%2147483648)/2147483648,T=c.tema||[c.colore,c.colore,"#fff"],cx=300+R()*200,cy=150+R()*150;
let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${T[0]}"/><stop offset=".6" stop-color="#0b0e15"/><stop offset="1" stop-color="${T[1]}"/></linearGradient></defs><rect width="800" height="450" fill="url(#g)"/>`;
for(let k=1;k<=12;k++){const r=k*28,p1=R()*6,p2=R()*6;let d="";for(let i=0;i<=60;i++){const a=i/60*6.2832,rr=r*(1+.1*Math.sin(3*a+p1)+.06*Math.sin(5*a+p2));d+=(i?"L":"M")+(cx+rr*1.5*Math.cos(a)).toFixed(1)+" "+(cy+rr*Math.sin(a)).toFixed(1)}s+=`<path d="${d}Z" fill="none" stroke="#fff" stroke-opacity="${(.05+k*.012).toFixed(2)}"/>`}
for(let i=0;i<c.intensita*3+3;i++)s+=`<circle cx="${(cx+(R()-.5)*420).toFixed(0)}" cy="${(cy+(R()-.5)*240).toFixed(0)}" r="${(2+R()*4).toFixed(1)}" fill="${T[2]}" fill-opacity=".8"/>`;
s+=`<circle cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" r="9" fill="#fff"/><circle cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" r="26" fill="none" stroke="#fff" stroke-width="2" stroke-opacity=".6"/><rect width="800" height="8" fill="${T[0]}"/></svg>`;return"data:image/svg+xml,"+encodeURIComponent(s)}
let GEO=null;function geo(){if(!MP||!GEO)return;L.geoJSON(GEO,{interactive:false,style:{color:"#33405a",weight:.8,fillColor:"#1b2233",fillOpacity:1}}).addTo(MP).bringToBack()}
async function J(u){const r=await fetch(u+"?"+Date.now());if(!r.ok)throw 0;return r.json()}
function shell(){$("dt").textContent=new Date().toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"});$("nm").textContent=S.nome||"";$("sb").textContent=S.sottotitolo||"";document.title=S.nome||"Conflitti in Asia";$("ft").textContent=(S.nome||"")+" · Sintesi di fonti pubbliche, da verificare sulle fonti originali."}
function tick(){const t=[...NEWS.slice(0,12).map(x=>x.title),...C.map(c=>c.nome+": "+c.sommario)];$("tk").textContent=t.join("   ·   ")}
function fill(){if(!$("lead"))return;const L=NEWS.find(x=>x.img)||NEWS[0],rest=NEWS.filter(x=>x!==L);
if(L)$("lead").innerHTML=`<div class="hero">${fig(L.img,col(L),(M[L.k[0]]||{}).nome)}<div class="ov">${kick(L)}<h1>${link(L)}</h1><p>${esc(L.d)}</p><div class="meta">${esc(L.fonte)} · ${ago(L.t)}</div></div></div><div class="side">${[...rest.filter(x=>x.img),...rest.filter(x=>!x.img)].slice(0,4).map(x=>`<article>${fig(x.img,col(x))}<div>${kick(x)}<h3>${link(x)}</h3><div class="meta">${ago(x.t)}</div></div></article>`).join("")}</div>`;
else{const c=[...C].sort((a,b)=>b.intensita-a.intensita)[0];$("lead").innerHTML=`<div>${fig("",c.colore,c.nome)}<div style="margin-top:12px"><span class="kick" style="--c:${c.colore}">${esc(ST[c.stato])}</span><h1><a href="#${c.id}">${esc(c.nome)}</a></h1><p>${esc(c.sommario)}</p></div></div><div></div>`}
$("cards").innerHTML=C.map(c=>{const a=NEWS.find(x=>x.k.includes(c.id)&&x.img);return`<a href="#${c.id}" style="text-decoration:none"><article class="card" style="--c:${c.colore}">${fig("",c.colore,c.regione)}<div class="b"><span class="kick" style="--c:${c.colore}">${ST[c.stato]}</span><h3>${esc(c.nome)}</h3><p>${esc(c.sommario)}</p></div></article></a>`}).join("");
$("news").innerHTML=NEWS.slice(0,24).map(nc).join("")||'<p class="meta">Nessun articolo recente.</p>';
$("leg").innerHTML=C.map(c=>`<a href="#${c.id}"><i style="--c:${c.colore}"></i>${esc(c.nome)}${CT[c.id]?` (${CT[c.id]})`:""}</a>`).join("");marks()}
function marks(){if(!MP)return;ML.clearLayers();C.forEach(c=>{const s=20+c.intensita*4+Math.min(CT[c.id]||0,10)*2,n=NEWS.find(x=>x.k.includes(c.id));
L.marker([c.lat,c.lng],{icon:L.divIcon({className:"",html:`<span class="dot" style="--c:${c.colore};--s:${s}px"></span>`,iconSize:[s,s]})}).addTo(ML).bindPopup(`<b>${esc(c.nome)}</b><br><i>${ST[c.stato]} · intensità ${c.intensita}/5</i><br>${esc(c.sommario)}${n?`<br><br><small>Ultima notizia: ${esc(n.title)}</small>`:""}<br><a href="#${c.id}">Apri la pagina →</a>`)})}
function home(){$("app").innerHTML=`<section class="lead" id="lead"></section><h2 class="sec" id="mappa">La mappa dei conflitti</h2><div id="map"></div><div class="leg" id="leg"></div><h2 class="sec" id="conflitti">I conflitti</h2><div class="grid" id="cards"></div><h2 class="sec" id="notizie">Ultime notizie</h2><div class="grid" id="news"></div>`;
if(window.L){MP=L.map("map",{scrollWheelZoom:false,zoomSnap:.5,minZoom:2,maxZoom:7}).setView([30,92],3);MP.attributionControl.setPrefix(false).addAttribution("Dati geografici: Natural Earth (pubblico dominio)");GEO?geo():J("asia.geojson").then(g=>{GEO=g;geo()}).catch(()=>{});ML=L.layerGroup().addTo(MP);setTimeout(()=>MP&&MP.invalidateSize(),400)}else MP=null;fill()}
function page(c){MP=null;const nn=NEWS.filter(x=>x.k.includes(c.id)),h=nn.find(x=>x.img);
const T=c.tema||[c.colore,c.colore,"#fff"];
$("app").innerHTML=`<div class="pg" style="--c1:${T[0]};--c2:${T[1]};--c3:${T[2]}"><div class="flag"><i style="background:${T[0]}"></i><i style="background:${T[1]}"></i><i style="background:${T[2]}"></i></div><section class="ph" style="background-image:url('${ART[c.colore]||""}');background-size:cover"><div class="pgl"></div><a class="back glass" href="#home" style="padding:7px 14px">← Prima pagina</a><div class="glass fl"><span>Intensità</span><b>${c.intensita}/5</b><div class="ib">${[1,2,3,4,5].map(i=>`<u class="${i<=c.intensita?"on":""}"></u>`).join("")}</div><span>Notizie recenti</span><b>${nn.length}</b></div><div class="pc"><span class="chip">${ST[c.stato]}</span><span class="chip">${esc(c.regione)}</span><h1>${esc(c.nome)}</h1><p class="deck">${esc(c.sommario)}</p></div></section>
<div class="kv">${(c.numeri||[]).map(x=>`<div><b>${esc(x[0])}</b><small>${esc(x[1])}</small></div>`).join("")}</div>
<h2 class="sec">Cosa i titoli non dicono</h2><div class="cols">${(c.retroscena||[]).map(x=>`<p>${esc(x)}</p>`).join("")}</div>
<h2 class="sec">Gli attori</h2><p>${esc(c.attori)}</p>
<h2 class="sec">Cronologia</h2><div class="tl">${(c.cronologia||[]).map(x=>`<div><b>${esc(x[0])}</b><br>${esc(x[1])}</div>`).join("")}</div>
<h2 class="sec">Testimonianze</h2>${(c.testimonianze||[]).map(t=>`<div class="tm"><b>${esc(t.nome)}</b><div class="meta">${esc(t.ruolo)}</div><p>${esc(t.testo)}</p><div class="meta"><a href="${H(t.fonte)}" target="_blank" rel="noopener">Fonte originale →</a></div></div>`).join("")||`<div class="tm"><p>${esc(c.archivio)}</p></div>`}
<h2 class="sec">Ultime notizie</h2><div class="grid">${nn.slice(0,9).map(nc).join("")||'<p class="meta">Nessun articolo recente su questo tema.</p>'}</div>
<h2 class="sec">Fonti</h2><div class="src">${(c.fonti||[]).map(f=>`<a href="${H(f[1])}" target="_blank" rel="noopener">${esc(f[0])}</a>`).join("")}</div></div>`}
