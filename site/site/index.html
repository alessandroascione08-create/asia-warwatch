<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Asia Warwatch</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f4efe4;--card:#fffdf8;--ink:#17130f;--mu:#6d6458;--ln:#d9cfbc;--acc:#a4161a}
@media(prefers-color-scheme:dark){:root{--bg:#15120f;--card:#1e1a16;--ink:#eee7da;--mu:#a89e90;--ln:#3a332b;--acc:#e5484d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 Georgia,"Times New Roman",serif}
a{color:inherit}.sans,nav,.kick,.meta,.strip,.tick,.leg,button{font-family:"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
.strip{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);padding:10px 0;border-bottom:1px solid var(--ln)}
.logo{display:block;text-align:center;font-size:clamp(40px,9vw,92px);font-weight:700;letter-spacing:-.02em;text-decoration:none;line-height:1.05;padding:18px 0 2px}
.tag{text-align:center;font-style:italic;color:var(--mu);margin-bottom:12px}
nav{display:flex;justify-content:center;gap:28px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:9px 0;font-size:13px;text-transform:uppercase;letter-spacing:.12em;flex-wrap:wrap}nav a{text-decoration:none}nav a:hover{color:var(--acc)}
.tick{background:var(--ink);color:var(--bg);display:flex;font-size:13px;margin-top:0}.tick b{flex-shrink:0;background:var(--acc);color:#fff;padding:7px 14px;text-transform:uppercase;letter-spacing:.1em;position:relative;z-index:2}
.tw{flex:1;min-width:0;overflow:hidden}.tw div{display:inline-block;white-space:nowrap;padding:7px 0 7px 100%;animation:mq 160s linear infinite}.tw:hover div{animation-play-state:paused}@keyframes mq{to{transform:translateX(-100%)}}
main{padding:26px 0 60px;min-height:60vh}
.sec{font:700 13px "Helvetica Neue",Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;border-top:3px solid var(--ink);padding-top:8px;margin:44px 0 18px}
.kick{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--c,var(--acc))}.meta{font-size:12px;color:var(--mu)}
figure{margin:0;aspect-ratio:16/9;background:linear-gradient(135deg,var(--c,#555),#111);overflow:hidden;position:relative}figure img{width:100%;height:100%;object-fit:cover;display:block}
figure span{position:absolute;left:12px;bottom:10px;color:#fff;font:700 12px Arial;letter-spacing:.2em;text-transform:uppercase;opacity:.85}
.lead{display:grid;grid-template-columns:2fr 1fr;gap:28px}@media(max-width:820px){.lead{grid-template-columns:1fr}}
.lead h1{font-size:clamp(28px,4.4vw,46px);line-height:1.12;margin:8px 0;letter-spacing:-.01em}.lead p{color:var(--mu);margin:6px 0}
.side article{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}.side article:first-child{padding-top:0}.side figure{aspect-ratio:1}.side h3{font-size:16px;line-height:1.3;margin:2px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--ln);border-top:5px solid var(--c);transition:.2s}.card:hover{transform:translateY(-3px)}.card .b{padding:14px 16px 18px}.card h3{margin:4px 0 6px;font-size:21px;line-height:1.2}.card p{margin:0;font-size:15px;color:var(--mu)}
.card.n{border-top-width:1px}.card.n h3{font-size:17px}
#map{height:480px;border:1px solid var(--ln);background:var(--card)}
.leg{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:13px}.leg a{text-decoration:none;display:flex;align-items:center;gap:7px}.leg i{width:11px;height:11px;border-radius:50%;background:var(--c)}
.dot{display:block;width:var(--s);height:var(--s);border-radius:50%;background:var(--c);opacity:.88;border:2px solid #fff;animation:pu 2.2s infinite}@keyframes pu{0%{box-shadow:0 0 0 0 var(--c)}70%{box-shadow:0 0 0 16px transparent}100%{box-shadow:0 0 0 0 transparent}}
.leaflet-popup-content{font:14px/1.45 Georgia,serif;color:#17130f}
.band{height:8px;background:var(--c);margin-bottom:14px}.back{font:13px Arial;text-transform:uppercase;letter-spacing:.1em;text-decoration:none;color:var(--mu)}
.pg h1{font-size:clamp(38px,7vw,72px);line-height:1.04;margin:6px 0;letter-spacing:-.02em}.deck{font-size:22px;font-style:italic;color:var(--mu);margin:0 0 20px;max-width:760px}
.cap{font:12px Arial;color:var(--mu);margin:6px 0 24px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);margin:22px 0}.kv div{padding:14px 16px;border-right:1px solid var(--ln)}.kv b{display:block;font-size:30px;color:var(--c);line-height:1.1}.kv small{font:12.5px Arial;color:var(--mu)}
.cols{columns:2 300px;column-gap:40px}.cols p,.cols li{break-inside:avoid;margin:0 0 14px}.cols p:first-child::first-letter{font-size:3.4em;float:left;line-height:.85;padding:6px 8px 0 0;color:var(--c);font-weight:700}
.tl{border-left:2px solid var(--c);margin-left:5px}.tl div{padding:0 0 14px 20px;position:relative}.tl div::before{content:"";position:absolute;left:-7px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--c)}.tl b{font:700 12px Arial;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.tm{border-left:4px solid var(--c);padding:6px 20px;margin:0 0 22px}.tm p{font-style:italic;font-size:19px;margin:6px 0}.tm .meta a{color:var(--c)}
.src a{display:inline-block;font:13px Arial;margin:3px 8px 3px 0;border-bottom:1px solid var(--c);text-decoration:none}
#ts{position:fixed;right:16px;bottom:16px;z-index:20;display:grid;gap:10px;max-width:330px}.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-left:5px solid var(--acc);font:14px/1.4 Arial;box-shadow:0 8px 30px #0005}
footer{border-top:3px double var(--ink);padding:22px 0;text-align:center;color:var(--mu);font:12.5px Arial}
</style></head><body>
<div class="wrap"><div class="strip"><span id="dt"></span><span id="up"></span></div><a class="logo" href="#home" id="nm"></a><div class="tag" id="sb"></div>
<nav><a href="#home">Prima pagina</a><a href="#mappa">Mappa</a><a href="#conflitti">Conflitti</a><a href="#notizie">Ultime notizie</a></nav></div>
<div class="tick"><b>Ultim’ora</b><div class="tw"><div id="tk"></div></div></div>
<main class="wrap" id="app"></main><div id="ts"></div>
<footer class="wrap" id="ft"></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=id=>document.getElementById(id);let S={},C=[],M={},NEWS=[],CT={},UPD=null,MP,ML;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const H=s=>/^https?:\/\//.test(s||"")?esc(s):"";
const ST={attivo:"Conflitto aperto",tensione:"Alta tensione",tregua:"Tregua fragile"};
const ago=t=>{const m=Math.round((Date.now()-new Date(t))/6e4);return m<60?m+" min fa":m<1440?Math.round(m/60)+" h fa":new Date(t).toLocaleDateString("it-IT",{day:"numeric",month:"short"})};
const col=x=>(M[(x.k||[])[0]]||{}).colore||"#555";
const fig=(img,c,txt)=>`<figure style="--c:${c}">${H(img)?`<img src="${H(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}<span>${esc(txt||"")}</span></figure>`;
const link=x=>`<a href="${H(x.u)}" target="_blank" rel="noopener">${esc(x.title)}</a>`;
const kick=x=>`<span class="kick" style="--c:${col(x)}">${esc((M[(x.k||[])[0]]||{}).nome||"Asia")}</span>`;
const nc=x=>`<article class="card n" style="--c:${col(x)}">${fig(x.img,col(x),(M[x.k[0]]||{}).nome)}<div class="b">${kick(x)}<h3>${link(x)}</h3><div class="meta">${esc(x.fonte)} · ${ago(x.t)}</div></div></article>`;
async function J(u){const r=await fetch(u+"?"+Date.now());if(!r.ok)throw 0;return r.json()}
function shell(){$("dt").textContent=new Date().toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"});$("nm").textContent=S.nome||"";$("sb").textContent=S.sottotitolo||"";document.title=S.nome||"Asia Warwatch";$("ft").textContent=(S.nome||"")+" · Sintesi di fonti pubbliche, da verificare sulle fonti originali."}
function tick(){const t=[...NEWS.slice(0,12).map(x=>x.title),...C.map(c=>c.nome+": "+c.sommario)];$("tk").textContent=t.join("   ·   ")}
function fill(){if(!$("lead"))return;const L=NEWS.find(x=>x.img)||NEWS[0],rest=NEWS.filter(x=>x!==L);
if(L)$("lead").innerHTML=`<div>${fig(L.img,col(L),(M[L.k[0]]||{}).nome)}<div style="margin-top:12px">${kick(L)}<h1>${link(L)}</h1><p>${esc(L.d)}</p><div class="meta">${esc(L.fonte)} · ${ago(L.t)}</div></div></div><div class="side">${rest.slice(0,4).map(x=>`<article>${fig(x.img,col(x))}<div>${kick(x)}<h3>${link(x)}</h3><div class="meta">${ago(x.t)}</div></div></article>`).join("")}</div>`;
else{const c=[...C].sort((a,b)=>b.intensita-a.intensita)[0];$("lead").innerHTML=`<div>${fig("",c.colore,c.nome)}<div style="margin-top:12px"><span class="kick" style="--c:${c.colore}">${esc(ST[c.stato])}</span><h1><a href="#${c.id}">${esc(c.nome)}</a></h1><p>${esc(c.sommario)}</p></div></div><div></div>`}
$("cards").innerHTML=C.map(c=>{const a=NEWS.find(x=>x.k.includes(c.id)&&x.img);return`<a href="#${c.id}" style="text-decoration:none"><article class="card" style="--c:${c.colore}">${fig(a&&a.img,c.colore,c.regione)}<div class="b"><span class="kick" style="--c:${c.colore}">${ST[c.stato]}</span><h3>${esc(c.nome)}</h3><p>${esc(c.sommario)}</p></div></article></a>`}).join("");
$("news").innerHTML=NEWS.slice(0,24).map(nc).join("")||'<p class="meta">Nessun articolo recente.</p>';
$("leg").innerHTML=C.map(c=>`<a href="#${c.id}"><i style="--c:${c.colore}"></i>${esc(c.nome)}${CT[c.id]?` (${CT[c.id]})`:""}</a>`).join("");marks()}
function marks(){if(!MP)return;ML.clearLayers();C.forEach(c=>{const s=20+c.intensita*4+Math.min(CT[c.id]||0,10)*2,n=NEWS.find(x=>x.k.includes(c.id));
L.marker([c.lat,c.lng],{icon:L.divIcon({className:"",html:`<span class="dot" style="--c:${c.colore};--s:${s}px"></span>`,iconSize:[s,s]})}).addTo(ML).bindPopup(`<b>${esc(c.nome)}</b><br><i>${ST[c.stato]} · intensità ${c.intensita}/5</i><br>${esc(c.sommario)}${n?`<br><br><small>Ultima notizia: ${esc(n.title)}</small>`:""}<br><a href="#${c.id}">Apri la pagina →</a>`)})}
function home(){$("app").innerHTML=`<section class="lead" id="lead"></section><h2 class="sec" id="mappa">La mappa dei conflitti</h2><div id="map"></div><div class="leg" id="leg"></div><h2 class="sec" id="conflitti">I conflitti</h2><div class="grid" id="cards"></div><h2 class="sec" id="notizie">Ultime notizie</h2><div class="grid" id="news"></div>`;
if(window.L){MP=L.map("map",{scrollWheelZoom:false}).setView([30,92],3);L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{attribution:"© OpenStreetMap, © CARTO",maxZoom:8}).addTo(MP);ML=L.layerGroup().addTo(MP)}else MP=null;fill()}
function page(c){MP=null;const nn=NEWS.filter(x=>x.k.includes(c.id)),h=nn.find(x=>x.img);
$("app").innerHTML=`<div class="pg" style="--c:${c.colore}"><a class="back" href="#home">← Prima pagina</a><div class="band" style="margin-top:14px"></div><span class="kick">${ST[c.stato]} · ${esc(c.regione)}</span><h1>${esc(c.nome)}</h1><p class="deck">${esc(c.sommario)}</p>${fig(h&&h.img,c.colore,c.nome)}<div class="cap">${h?`${esc(h.fonte)} · <a href="${H(h.u)}" target="_blank" rel="noopener">${esc(h.title)}</a>`:""}</div>
<div class="kv">${(c.numeri||[]).map(x=>`<div><b>${esc(x[0])}</b><small>${esc(x[1])}</small></div>`).join("")}</div>
<h2 class="sec">Cosa i titoli non dicono</h2><div class="cols">${(c.retroscena||[]).map(x=>`<p>${esc(x)}</p>`).join("")}</div>
<h2 class="sec">Gli attori</h2><p>${esc(c.attori)}</p>
<h2 class="sec">Cronologia</h2><div class="tl">${(c.cronologia||[]).map(x=>`<div><b>${esc(x[0])}</b><br>${esc(x[1])}</div>`).join("")}</div>
<h2 class="sec">Testimonianze</h2>${(c.testimonianze||[]).map(t=>`<div class="tm"><b>${esc(t.nome)}</b><div class="meta">${esc(t.ruolo)}</div><p>${esc(t.testo)}</p><div class="meta"><a href="${H(t.fonte)}" target="_blank" rel="noopener">Fonte originale →</a></div></div>`).join("")||`<div class="tm"><p>${esc(c.archivio)}</p></div>`}
<h2 class="sec">Ultime notizie</h2><div class="grid">${nn.slice(0,9).map(nc).join("")||'<p class="meta">Nessun articolo recente su questo tema.</p>'}</div>
<h2 class="sec">Fonti</h2><div class="src">${(c.fonti||[]).map(f=>`<a href="${H(f[1])}" target="_blank" rel="noopener">${esc(f[0])}</a>`).join("")}</div></div>`}
function route(){const k=location.hash.slice(1),c=C.find(x=>x.id==k);if(c){page(c);scrollTo(0,0)}else{if(!$("lead"))home();const e=$(k);e?e.scrollIntoView():k=="home"||!k?scrollTo(0,0):0}}
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;$("ts").append(e);setTimeout(()=>e.remove(),9000)}
async function news(first){try{const j=await J("news.json"),old=new Set(NEWS.map(x=>x.u));const fresh=(j.items||[]).filter(x=>!old.has(x.u));NEWS=j.items||[];CT=j.counts||{};UPD=j.updated;
if(!first)fresh.slice(0,2).forEach(x=>toast("Ultim’ora · "+x.title));
$("up").textContent=UPD?"Aggiornato alle "+new Date(UPD).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}):"";tick();fill();if(first===false&&!$("lead")&&!MP)route()}catch(e){}}
(async()=>{try{const d=await J("conflitti.json");S=d.sito||{};C=d.conflitti||[];C.forEach(c=>M[c.id]=c)}catch(e){$("app").innerHTML="<p>Contenuti non disponibili.</p>";return}
shell();tick();await news(true);route();addEventListener("hashchange",route);setInterval(()=>news(false),300000)})();
</script></body></html>
